[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "selfheal-runtime"
version = "0.3.0"
description = "Embeddable AI healing agent and Rust-backed live repair runtime for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SelfHeal Runtime Contributors" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.scripts]
selfheal = "selfheal.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.maturin]
python-source = "python"
module-name = "selfheal._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-q"
