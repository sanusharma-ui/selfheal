name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
            artifact: linux-x64
          - os: windows-latest
            target: x86_64
            artifact: windows-x64
          - os: macos-15-intel
            target: x86_64
            artifact: macos-intel
          - os: macos-14
            target: aarch64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install all supported Python versions for wheel builds
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - name: Make Python 3.11 the default for tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked notice sources
        run: cargo fetch --locked
      - name: Verify dependency notices
        run: python scripts/generate_notices.py --check
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --locked --find-interpreter
          manylinux: auto
      - name: Check archive contents
        run: python scripts/check_dist.py
      - name: Install the built wheel with verification dependencies
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*-cp311-*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[verification,exploration]'])"
      - name: Verify installed SDK origin and command entry point
        run: |
          python -c "import pathlib, selfheal, selfheal._core; root = pathlib.Path(selfheal.__file__).resolve(); assert 'site-packages' in root.parts, root; print(root)"
          selfheal --help
          selfheal doctor
      - name: Run regressions against the installed wheel
        run: python -m pytest tests -o pythonpath= --import-mode=importlib
      - name: Check package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked
      - run: python scripts/generate_notices.py --check
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - run: python scripts/check_dist.py
      - name: Build a wheel from the source archive
        run: python -m pip wheel --no-deps --wheel-dir source-wheel dist/*.tar.gz
      - name: Validate the source-built wheel
        run: |
          python scripts/check_dist.py source-wheel/*.whl
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('source-wheel').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[verification,exploration]'])"
          python -m selfheal doctor
          python -m pytest tests -o pythonpath= --import-mode=importlib
      - name: Check source archive metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tag must match package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "refs/tags/v$VERSION" = "$GITHUB_REF" || { echo "Tag $GITHUB_REF does not match v$VERSION"; exit 1; }
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1