[package]
name = "selfheal-runtime"
version = "0.3.0"
edition = "2021"
description = "Rust core for a provider-independent self-healing Python application runtime"
license = "MIT"
publish = false
include = [
    "src/**", "python/selfheal/**/*.py", "python/selfheal/**/*.pyi",
    "python/selfheal/py.typed", "Cargo.toml", "Cargo.lock", "pyproject.toml",
    "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "SECURITY.md", "CHANGELOG.md",
]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
